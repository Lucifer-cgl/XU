<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独立 HTML 示例</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #17332a; background: #edf5f1; }
    main { max-width: 760px; margin: 40px auto; padding: 42px; background: white; border-radius: 18px; }
    h1 { font-size: 42px; }
    .note { padding: 18px; border-left: 4px solid #0b6b4f; background: #e1f1ea; }
    .actions { display: flex; gap: 10px; margin-bottom: 24px; }
    button, a { border: 0; border-radius: 999px; padding: 9px 14px; background: #17332a; color: white; text-decoration: none; cursor: pointer; }
    @media print { .actions { display: none; } body { background: white; } main { margin: 0; padding: 0; } }
  </style>
</head>
<body>
  <main>
    <div class="actions"><a href="/">返回知识库</a><button type="button" data-xu-print>保存为 PDF</button></div>
    <h1>独立 HTML 示例</h1>
    <p class="note">完整 HTML 文件会原样发布，不经过 Markdown 转换，也不会被强制套用 Markdown 阅读模板。</p>
    <p>它仍会出现在平台目录与搜索结果中。作者可以在这个文件里自行设计布局与打印样式。</p>
  </main>
  <script src="/static/html-tools.js" defer></script>
</body>
</html>
